    /* ===================== LOGIN ===================== */
    function LoginScreen({ onLogin }) {
      const [rol, setRol] = useState('trabajador');
      const [usuario, setUsuario] = useState('');
      const [clave, setClave] = useState('');
      const [verClave, setVerClave] = useState(false);
      const [error, setError] = useState('');

      function submit() {
        if (!usuario.trim() || !clave.trim()) {
          setError('Ingresa tu usuario y contraseña.');
          return;
        }
        setError('');
        onLogin(rol, usuario.trim());
      }

      function onKeyDownField(e) {
        if (e.key === 'Enter') submit();
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.bg, padding: 20 }}>
          <div style={{ width: '100%', maxWidth: 380 }}>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 26 }}>
              <Logo />
            </div>
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24 }}>
              <div style={{ display: 'flex', background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: 3, marginBottom: 20 }}>
                {['trabajador', 'admin'].map(r => (
                  <button key={r} type="button" onClick={() => setRol(r)} style={{
                    flex: 1, padding: '9px 0', borderRadius: 8, border: 'none',
                    background: rol === r ? C.amber : 'transparent', color: rol === r ? C.bg : C.textDim,
                    fontFamily: 'Inter', fontWeight: 600, fontSize: 13, cursor: 'pointer',
                  }}>
                    {r === 'trabajador' ? 'Trabajador' : 'Administrador'}
                  </button>
                ))}
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <Field label="Usuario">
                  <input style={inputStyle} placeholder="ej. rhuaman" value={usuario} onChange={e => setUsuario(e.target.value)} onKeyDown={onKeyDownField} />
                </Field>
                <Field label="Contraseña">
                  <div style={{ position: 'relative' }}>
                    <input
                      style={{ ...inputStyle, paddingRight: 38 }} type={verClave ? 'text' : 'password'}
                      placeholder="••••••••" value={clave} onChange={e => setClave(e.target.value)} onKeyDown={onKeyDownField}
                    />
                    <button type="button" onClick={() => setVerClave(v => !v)} style={{
                      position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)',
                      background: 'none', border: 'none', cursor: 'pointer', color: C.muted, padding: 4,
                    }}>
                      {verClave ? <I.EyeOff size={16} /> : <I.Eye size={16} />}
                    </button>
                  </div>
                </Field>
                {error && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: C.red, fontFamily: 'Inter', fontSize: 12.5 }}>
                    <I.AlertTriangle size={14} /> {error}
                  </div>
                )}
                <button type="button" onClick={submit} style={{
                  marginTop: 4, background: C.amber, color: C.bg, border: 'none', borderRadius: 9,
                  padding: '11px 0', fontFamily: 'Inter', fontWeight: 700, fontSize: 14, cursor: 'pointer',
                }}>
                  Ingresar
                </button>
                <div style={{ textAlign: 'center', fontFamily: 'Inter', fontSize: 12, color: C.muted, cursor: 'pointer' }}>
                  ¿Olvidaste tu contraseña? Pide un reinicio al administrador.
                </div>
              </div>
            </div>
            <div style={{
              display: 'flex', alignItems: 'flex-start', gap: 8, marginTop: 16, padding: '10px 12px',
              background: C.tealSoft, border: `1px solid ${C.border}`, borderRadius: 10,
            }}>
              <I.Lock size={14} color={C.teal} style={{ marginTop: 2, flexShrink: 0 }} />
              <span style={{ fontFamily: 'Inter', fontSize: 11.5, color: C.textDim, lineHeight: 1.5 }}>
                Conexión cifrada (HTTPS/TLS). Las contraseñas nunca se guardan como texto plano: se almacenan con hash bcrypt/Argon2 + sal única por usuario, así que ni el equipo técnico puede leerlas.
              </span>
            </div>
          </div>
        </div>
      );
    }

    function HorarioEditor({ horarioData, onChange }) {

              }}>

                <>

                </>
              )}

    function resumenHorario(h) {
      const activos = h.filter(d => !d.libre);
      if (activos.length === 0) return 'Sin turnos asignados';
      if (activos.length === 7 && new Set(activos.map(d => (d.ini || '') + (d.fin || ''))).size === 1) {
        return `Lun a Dom · ${activos[0].ini} – ${activos[0].fin}`;
      }
      return activos.map(d => `${d.dia} ${d.ini}-${d.fin}`).join(' · ');
    }

    function TrabajadoresAdmin() {
      const [trabajadores, setTrabajadores] = useState(TRABAJADORES_INIT);
      const [mostrarForm, setMostrarForm] = useState(false);
      const [nuevo, setNuevo] = useState({
        nombre: '', dni: '', usuario: '', clave: '', estacion: ESTACIONES[0],
        horario: horario(Object.fromEntries(DIAS.map(d => [d, { libre: true, ini: '', fin: '' }]))),
      });

      function actualizarDiaNuevo(i, valor) {
        setNuevo(prev => ({ ...prev, horario: prev.horario.map((d, j) => j === i ? valor : d) }));
      }

      function agregar() {
        if (!nuevo.nombre.trim() || !nuevo.dni.trim() || !nuevo.usuario.trim() || !nuevo.clave.trim()) return;
        setTrabajadores(prev => [...prev, { id: Date.now(), ...nuevo }]);
        setNuevo({ nombre: '', dni: '', usuario: '', clave: '', estacion: ESTACIONES[0], horario: horario(Object.fromEntries(DIAS.map(d => [d, { libre: true, ini: '', fin: '' }]))) });
        setMostrarForm(false);
      }

      function eliminar(id) {
        setTrabajadores(prev => prev.filter(t => t.id !== id));
      }

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontFamily: 'Inter', fontSize: 13, color: C.textDim }}>{trabajadores.length} trabajadores registrados</span>
            <button onClick={() => setMostrarForm(v => !v)} type="button" style={{
              display: 'flex', alignItems: 'center', gap: 6, background: C.amber, color: C.bg, border: 'none',
              borderRadius: 8, padding: '9px 16px', fontFamily: 'Inter', fontWeight: 600, fontSize: 13, cursor: 'pointer',
            }}>
              {mostrarForm ? <I.X size={14} /> : <I.Plus size={14} />} {mostrarForm ? 'Cancelar' : 'Añadir trabajador'}
            </button>
          </div>

          {mostrarForm && (
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 12 }}>
                <Field label="Nombre completo">
                  <input style={inputStyle} value={nuevo.nombre} onChange={e => setNuevo(p => ({ ...p, nombre: e.target.value }))} placeholder="Nombre y apellido" />
                </Field>
                <Field label="DNI">
                  <input style={inputStyle} value={nuevo.dni} onChange={e => setNuevo(p => ({ ...p, dni: e.target.value }))} placeholder="12345678" />
                </Field>
                <Field label="Usuario de acceso">
                  <input style={inputStyle} value={nuevo.usuario} onChange={e => setNuevo(p => ({ ...p, usuario: e.target.value }))} placeholder="jperez" />
                </Field>
                <Field label="Contraseña temporal">
                  <input style={inputStyle} type="text" value={nuevo.clave} onChange={e => setNuevo(p => ({ ...p, clave: e.target.value }))} placeholder="Se pedirá cambiarla" />
                </Field>
              </div>
              <Field label="Grifo asignado">
                <select style={{ ...inputStyle, cursor: 'pointer' }} value={nuevo.estacion} onChange={e => setNuevo(p => ({ ...p, estacion: e.target.value }))}>
                  {ESTACIONES.map(e => <option key={e} value={e} style={{ background: C.bg }}>{e}</option>)}
                </select>
              </Field>
              <Field label="Horario semanal">
                <HorarioEditor horarioData={nuevo.horario} onChange={actualizarDiaNuevo} />
              </Field>
              <button onClick={agregar} type="button" style={{
                alignSelf: 'flex-start', background: C.amber, color: C.bg, border: 'none', borderRadius: 8,
                padding: '10px 20px', fontFamily: 'Inter', fontWeight: 700, fontSize: 13, cursor: 'pointer',
              }}>
                Guardar trabajador
              </button>
            </div>
          )}

          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {trabajadores.map(t => (
              <div key={t.id} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 14 }}>

    /* ===================== TRABAJADOR: VENTA ===================== */
    function VentaTrabajador({ estacion, ventas, setVentas, fechaOperativa }) {
      const isMobile = useIsMobile();
      const [productoId, setProductoId] = useState('diesel');
      const [modo, setModo] = useState('galones');
      const [valor, setValor] = useState('');
      const [metodo, setMetodo] = useState('efectivo');
      const [comprobante, setComprobante] = useState('boleta');
      const [ruc, setRuc] = useState('');
      const [razonSocial, setRazonSocial] = useState('');

      const producto = PRODUCTOS.find(p => p.id === productoId);
      const num = parseFloat(valor) || 0;
      const galones = modo === 'galones' ? num : num / producto.precio;
      const soles = modo === 'soles' ? num : num * producto.precio;
      const puedeRegistrar = num > 0 && (comprobante === 'boleta' || (ruc.trim().length > 0 && razonSocial.trim().length > 0));

      function registrar() {
        if (!puedeRegistrar) return;
        const now = new Date();
        setVentas(prev => [{
          fecha: formatFechaCorta(fechaOperativa),
          hora: now.toTimeString().slice(0, 5),
          producto: producto.nombre,
          cant: `${galones.toFixed(2)} ${producto.unidad}`,
          total: soles,
          metodo: METODOS.find(m => m.id === metodo).label,
          comp: comprobante === 'factura' ? 'Factura' : 'Boleta',
        }, ...prev]);
        setValor('');
        setRuc('');
        setRazonSocial('');
      }

      const totalTurno = ventas.reduce((a, v) => a + v.total, 0);

      return (
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.3fr 1fr', gap: 16 }}>
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20 }}>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 12, textTransform: 'uppercase', letterSpacing: '0.06em' }}>1. Selecciona el producto</div>
            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)', gap: 10 }}>
              {PRODUCTOS.map(p => {
                const sel = p.id === productoId;
                const IconComp = { diesel: I.Fuel, urea: I.Droplet, regular: I.Gauge }[p.id] || I.Fuel;
                return (
                  <button key={p.id} onClick={() => setProductoId(p.id)} type="button" style={{
                    display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 8, padding: '14px 14px',
                    borderRadius: 10, cursor: 'pointer', textAlign: 'left',
                    border: `1.5px solid ${sel ? p.color : C.border}`, background: sel ? p.soft : C.bg,
                  }}>
                    <IconComp size={18} color={p.color} />
                    <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.text, fontWeight: 500 }}>{p.nombre}</div>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 14, color: p.color, fontWeight: 700 }}>S/ {p.precio.toFixed(2)}</div>
                  </button>
                );
              })}
            </div>

            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', margin: '18px 0 10px' }}>
              <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>2. ¿Cómo te lo piden?</span>
              <div style={{ display: 'flex', gap: 6 }}>
                <Pill active={modo === 'galones'} onClick={() => { setModo('galones'); setValor(''); }} Icon={I.Gauge}>Por galones</Pill>
                <Pill active={modo === 'soles'} onClick={() => { setModo('soles'); setValor(''); }} Icon={I.Wallet}>Por soles</Pill>
              </div>
            </div>
            <input
              type="number" step="0.01"
              placeholder={modo === 'galones' ? `Cantidad en ${producto.unidad}` : 'Monto en soles'}
              value={valor} onChange={e => setValor(e.target.value)}
              style={{ width: '100%', background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: '12px 14px', color: C.text, fontFamily: 'JetBrains Mono', fontSize: 18, boxSizing: 'border-box' }}
            />
            {num > 0 && (
              <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.teal, marginTop: 8 }}>
                {modo === 'galones' ? `= ${money(soles)} en total` : `= ${galones.toFixed(2)} ${producto.unidad} de ${producto.nombre.toLowerCase()}`}
              </div>
            )}

            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, margin: '18px 0 10px', textTransform: 'uppercase', letterSpacing: '0.06em' }}>3. Forma de pago</div>              <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(4, 1fr)', gap: 8 }}>
              {METODOS.map(m => {
                const sel = m.id === metodo;
                const IconComp = { efectivo: I.Banknote, tarjeta: I.CreditCard, yape: I.Smartphone, transferencia: I.ArrowLeftRight }[m.id] || I.Banknote;
                return (
                  <button key={m.id} onClick={() => setMetodo(m.id)} type="button" style={{
                    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '10px 6px', borderRadius: 10, cursor: 'pointer',
                    border: `1.5px solid ${sel ? C.amber : C.border}`, background: sel ? C.amberSoft : C.bg,
                  }}>
                    <IconComp size={16} color={sel ? C.amber : C.textDim} />
                    <span style={{ fontFamily: 'Inter', fontSize: 11, color: sel ? C.amber : C.textDim }}>{m.label}</span>
                  </button>
                );
              })}
            </div>

            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, margin: '18px 0 10px', textTransform: 'uppercase', letterSpacing: '0.06em' }}>4. Comprobante</div>
            <div style={{ display: 'flex', gap: 8, marginBottom: comprobante === 'factura' ? 12 : 0 }}>
              <Pill active={comprobante === 'boleta'} onClick={() => setComprobante('boleta')} Icon={I.Receipt}>Boleta</Pill>
              <Pill active={comprobante === 'factura'} onClick={() => setComprobante('factura')} Icon={I.FileText}>Factura</Pill>

            {comprobante === 'factura' && (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: 8 }}>
                <input placeholder="RUC" value={ruc} onChange={e => setRuc(e.target.value)} style={inputStyle} />

            )}

            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 20, paddingTop: 16, borderTop: `1px solid ${C.border}` }}>
              <div>
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Total a cobrar</div>
                <div style={{ fontFamily: 'JetBrains Mono', fontSize: 26, fontWeight: 700, color: C.amber, textShadow: `0 0 14px ${C.amber}55` }}>{money(soles)}</div>
              </div>
              <button onClick={registrar} disabled={!puedeRegistrar} type="button" style={{
                background: puedeRegistrar ? C.amber : C.panelLight, color: puedeRegistrar ? C.bg : C.muted, border: 'none',
                borderRadius: 10, padding: '14px 26px', fontFamily: 'Inter', fontWeight: 700, fontSize: 14,
                cursor: puedeRegistrar ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', gap: 8,
              }}>
                <I.Check size={16} /> Registrar venta
              </button>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                <I.Clock size={14} color={C.teal} />
                <span style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>Turno actual · {estacion}</span>
              </div>
              <div style={{ fontFamily: 'Oswald', fontSize: 24, fontWeight: 600, color: C.text, marginTop: 6 }}>{money(totalTurno)}</div>
              <div style={{ fontFamily: 'Inter', fontSize: 11.5, color: C.muted }}>{ventas.length} ventas registradas · fecha operativa {formatFechaCorta(fechaOperativa)}</div>
            </div>

            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, flex: 1 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.textDim, marginBottom: 12 }}>Ventas recientes</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 380, overflowY: 'auto' }}>
                {ventas.length === 0 && (
                  <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.muted, textAlign: 'center', padding: '18px 0' }}>
                    Aún no hay ventas en este turno.
                  </div>
                )}
                {ventas.map((v, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10.5, color: C.muted, width: 46, flexShrink: 0, lineHeight: 1.3 }}>{v.fecha}<br />{v.hora}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.text }}>{v.producto}</div>
                      <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>{v.cant} · {v.metodo} · {v.comp}</div>
                    </div>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12.5, color: C.text, flexShrink: 0 }}>{money(v.total)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== TRABAJADOR: CIERRE DE TURNO ===================== */
    function CierreTurno({ estacion, ventas, usuario, fechaOperativa, historialTurnos, onCerrarTurno }) {
      const isMobile = useIsMobile();
      const [efectivoContado, setEfectivoContado] = useState('');
      const [cerrado, setCerrado] = useState(false);

      const porMetodo = METODOS.map(m => ({
        ...m, total: ventas.filter(v => v.metodo === m.label).reduce((a, v) => a + v.total, 0),
      }));
      const totalGeneral = ventas.reduce((a, v) => a + v.total, 0);
      const totalEfectivoEsperado = porMetodo.find(m => m.id === 'efectivo').total;
      const contado = parseFloat(efectivoContado) || 0;
      const diferencia = contado - totalEfectivoEsperado;

      const hoy = DIAS[(new Date().getDay() + 6) % 7];
      const trabajadorHoy = TRABAJADORES_INIT.find(t => t.usuario === usuario);
      const horarioHoy = trabajadorHoy?.horario.find(d => d.dia === hoy);

      function cerrarTurno() {
        if (cerrado || efectivoContado === '') return;
        setCerrado(true);
        onCerrarTurno({
          fecha: formatFechaCorta(fechaOperativa),
          totalGeneral,
          totalVentas: ventas.length,
          efectivoContado: contado,
          diferencia,
        });
      }

      return (
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.2fr 1fr', gap: 16 }}>
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <I.ListChecks size={16} color={C.amber} />
                <span style={{ fontFamily: 'Inter', fontSize: 14, fontWeight: 600, color: C.text }}>Resumen del turno · {estacion}</span>
              </div>
              <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.muted }}>{formatFechaCorta(fechaOperativa)}</span>
            </div>

            {cerrado ? (
              <div style={{
                display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center', textAlign: 'center',
                padding: '28px 10px', background: C.greenSoft, borderRadius: 10,
              }}>
                <I.Check size={26} color={C.green} />
                <div style={{ fontFamily: 'Inter', fontSize: 14, fontWeight: 600, color: C.green }}>Turno del {formatFechaCorta(fechaOperativa)} cerrado y reportado</div>
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim, lineHeight: 1.6 }}>
                  La fecha operativa avanzó a <b style={{ color: C.text }}>{formatFechaCorta(addDias(fechaOperativa, 1))}</b>. Las próximas ventas que registres en "Nueva venta" ya se guardarán con esa fecha.
                </div>
              </div>
            ) : (
              <>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 18 }}>
                  {porMetodo.map(m => {
                    const IconComp = { efectivo: I.Banknote, tarjeta: I.CreditCard, yape: I.Smartphone, transferencia: I.ArrowLeftRight }[m.id] || I.Banknote;
                    return (
                      <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                        <IconComp size={15} color={C.textDim} />
                        <span style={{ fontFamily: 'Inter', fontSize: 13, color: C.textDim, flex: 1 }}>{m.label}</span>
                        <span style={{ fontFamily: 'JetBrains Mono', fontSize: 13.5, color: C.text }}>{money(m.total)}</span>
                      </div>
                    );
                  })}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 10px', background: C.amberSoft, borderRadius: 8, marginTop: 4 }}>
                    <span style={{ fontFamily: 'Inter', fontSize: 13, color: C.amber, fontWeight: 600, flex: 1 }}>Total del turno</span>
                    <span style={{ fontFamily: 'JetBrains Mono', fontSize: 15, color: C.amber, fontWeight: 700 }}>{money(totalGeneral)}</span>
                  </div>
                </div>
                <Field label="Efectivo contado en caja (S/)">
                  <input type="number" step="0.01" value={efectivoContado} onChange={e => setEfectivoContado(e.target.value)}
                    placeholder="0.00" style={{ ...inputStyle, fontFamily: 'JetBrains Mono', fontSize: 16 }} />
                </Field>
                {efectivoContado !== '' && (
                  <div style={{
                    marginTop: 12, padding: '10px 12px', borderRadius: 8,
                    background: diferencia === 0 ? C.greenSoft : C.redSoft,
                    color: diferencia === 0 ? C.green : C.red, fontFamily: 'Inter', fontSize: 12.5, display: 'flex', alignItems: 'center', gap: 8,
                  }}>
                    {diferencia === 0 ? <I.Check size={14} /> : <I.AlertTriangle size={14} />}
                    {diferencia === 0 ? 'La caja cuadra exactamente.' : `Diferencia de ${money(Math.abs(diferencia))} (${diferencia > 0 ? 'sobra' : 'falta'} dinero).`}
                  </div>
                )}
                <button
                  onClick={cerrarTurno} disabled={efectivoContado === ''} type="button"
                  style={{
                    marginTop: 18, width: '100%', background: efectivoContado === '' ? C.panelLight : C.amber, color: efectivoContado === '' ? C.muted : C.bg,
                    border: 'none', borderRadius: 10, padding: '13px 0', fontFamily: 'Inter', fontWeight: 700, fontSize: 14,
                    cursor: efectivoContado === '' ? 'not-allowed' : 'pointer',
                  }}
                >
                  Cerrar turno y enviar reporte
                </button>
              </>
            )}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                <I.Clock size={14} color={C.teal} />
                <span style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>Horario de hoy ({hoy})</span>
              </div>
              <div style={{ fontFamily: 'Oswald', fontSize: 20, fontWeight: 600, color: C.text }}>
                {horarioHoy && !horarioHoy.libre ? `${horarioHoy.ini} – ${horarioHoy.fin}` : 'Día libre'}
              </div>
            </div>

            <div style={{ background: C.tealSoft, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, display: 'flex', gap: 10 }}>
              <I.AlertTriangle size={16} color={C.teal} style={{ flexShrink: 0, marginTop: 2 }} />
              <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.textDim, lineHeight: 1.6 }}>
                Política de cierre: el turno se puede cerrar en cualquier momento, sin importar la hora (pensado para turnos nocturnos que cruzan la medianoche, como 10 pm – 6 am). En cuanto cierras, la fecha operativa avanza automáticamente al día siguiente y las ventas nuevas quedan registradas con esa fecha.
              </div>
            </div>

            {historialTurnos.length > 0 && (
              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
                <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.textDim, marginBottom: 10 }}>Turnos cerrados anteriores</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {historialTurnos.slice().reverse().map((h, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 11.5, color: C.muted, width: 44 }}>{h.fecha}</span>
                      <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim, flex: 1 }}>{h.totalVentas} ventas</span>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12.5, color: C.text }}>{money(h.totalGeneral)}</span>
                      <span style={{ fontFamily: 'Inter', fontSize: 11, color: h.diferencia === 0 ? C.green : C.red }}>
                        {h.diferencia === 0 ? 'Cuadrado' : (h.diferencia > 0 ? '+' : '') + money(h.diferencia)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

              <>
                <TabBar tabs={adminTabs} active={tabAdmin} onChange={setTabAdmin} />
                {tabAdmin === 'resumen' ? <ResumenAdmin estacion={estacion} /> : <TrabajadoresAdmin />}
              </>
            ) : (
              <>
                <TabBar tabs={trabajadorTabs} active={tabTrabajador} onChange={setTabTrabajador} />
                {tabTrabajador === 'venta'
                  ? <VentaTrabajador estacion={estacion} ventas={ventas} setVentas={setVentas} fechaOperativa={fechaOperativa} />
                  : <CierreTurno estacion={estacion} ventas={ventas} usuario={sesion.usuario} fechaOperativa={fechaOperativa} historialTurnos={historialTurnos} onCerrarTurno={cerrarTurno} />}
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GrifosKala />);
  </script>
</body>
</html>
